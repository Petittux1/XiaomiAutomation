<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 模块升级后 WebUI 容易被 WebView 命中旧缓存: 显式禁用缓存 + 资源带版本号(见 tools/build_zip.sh) -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>澎湃自动化—XiaomiAutomation</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b24; --card2: #1c222d; --line: #283040;
    --fg: #e8ecf3; --mut: #8b95a9; --acc: #3b82f6; --ok: #22c55e; --warn: #f59e0b;
    --r: 16px; --gap: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.55 -apple-system, "PingFang SC", "Noto Sans CJK SC", "Segoe UI", Roboto, sans-serif;
    padding: 14px 12px 36px;
  }

  /* ---------- 页头 ---------- */
  header { display: flex; align-items: center; gap: 8px; max-width: 560px; margin: 0 auto 12px; }
  h1 { font-size: 17px; font-weight: 700; flex: 1; min-width: 0;
       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lang { flex: none; width: auto; padding: 7px 8px; font-size: 12px; border-radius: 9px; }

  /* ---------- 概览区 ---------- */
  .hero {
    max-width: 560px; margin: 0 auto 14px; padding: 14px;
    background: linear-gradient(160deg, #1b2432 0%, var(--card) 55%);
    border: 1px solid var(--line); border-radius: var(--r);
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    background: #0f141c; border: 1px solid var(--line); color: var(--mut);
    font-variant-numeric: tabular-nums;
  }
  .chip.ok   { color: var(--ok);   border-color: #1e5c38; }
  .chip.warn { color: var(--warn); border-color: #6b4a12; }
  #ver { font-size: 12px; padding: 4px 10px; border-radius: 999px;
         background: #0f141c; border: 1px solid var(--line); color: var(--mut); }
  .hero .hint { margin: 10px 0 0; }
  .hero-btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .hero-btns .primary { flex: 1; min-width: 140px; }

  /* ---------- 折叠分组 ---------- */
  main { display: flex; flex-direction: column; gap: var(--gap); max-width: 560px; margin: 0 auto; }
  details.sec {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r); overflow: hidden;
  }
  details.sec > summary {
    list-style: none; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 9px;
    padding: 13px 14px; font-size: 14px; font-weight: 600;
  }
  details.sec > summary::-webkit-details-marker { display: none; }
  /* 自绘箭头: 展开时旋转 90°。用 CSS 而不是文字符号, 免得多语言里出现裸箭头字符。 */
  details.sec > summary::before {
    content: ''; flex: none; width: 7px; height: 7px;
    border-right: 2px solid var(--mut); border-bottom: 2px solid var(--mut);
    transform: rotate(-45deg); transition: transform .16s ease; margin-left: 2px;
  }
  details.sec[open] > summary::before { transform: rotate(45deg); }
  details.sec[open] > summary { border-bottom: 1px solid var(--line); }
  .sbody { padding: 12px 14px 14px; }
  .sbody > *:first-child { margin-top: 0; }
  .badge-dot { margin-left: auto; font-size: 11px; color: var(--mut); font-weight: 400; }

  /* ---------- 通用控件 ---------- */
  .hint { font-size: 12px; line-height: 1.6; color: var(--mut); }

  /* ---------- 缺少 root 桥时的整页提示 ----------
     正常情况下隐藏。只有当页面不在 root 管理器的 WebView 里打开(管理器没注入
     ksu 全局对象)才显示, 见 app.js 的 bridgeOk()。 */
  #nobridge {
    max-width: 560px; margin: 0 auto 14px; padding: 14px 14px 16px;
    background: var(--card); border: 1px solid var(--warn); border-radius: var(--r);
  }
  #nobridge h2 { font-size: 16px; font-weight: 700; color: var(--warn); margin-bottom: 8px; }
  #nobridge p { font-size: 13px; line-height: 1.7; color: var(--fg); }
  #nobridge p + p { margin-top: 8px; color: var(--mut); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: var(--gap); }
  .rowwrap { flex-wrap: wrap; }
  .flex1 { flex: 1; min-width: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); margin-top: var(--gap); }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: var(--gap); }
  .fld { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--mut); }
  .fld input, .fld select { width: 100%; }
  .fldcap { font-size: 11px; color: var(--mut); margin-top: var(--gap); }

  input[type=time], input[type=password], input[type=number], input[type=text], select {
    background: #0f141c; color: var(--fg); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; min-width: 0;
    font-family: inherit;
  }
  select { flex: 1; }
  input:focus, select:focus { outline: none; border-color: var(--acc); }

  button {
    border: 1px solid var(--line); background: #0f141c; color: var(--fg);
    border-radius: 10px; padding: 10px 14px; font-size: 14px; font-family: inherit;
    cursor: pointer; white-space: nowrap;
  }
  button.primary { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
  button.ghost { color: var(--mut); background: transparent; }
  button.danger { color: #f87171; }
  button.small { padding: 7px 11px; font-size: 12px; }
  button:active { opacity: .75; }

  /* 开关行: 文字在左, 勾选框在右, 整行可点。
     wrap + min-width:0 是防竖排的通用保险: 文案再长也是整字换行到下一行,
     而不会被压成一个字宽 —— 中文可以在任意两字间断行, 宽度被压到 1 个字时
     就会变成竖着排。拉丁文不肯断词所以看不出来, 但那只是没暴露而已。 */
  .sw {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; padding: 11px 2px; border-top: 1px solid var(--line); cursor: pointer;
  }
  .sw:first-child { border-top: none; }
  .sw span { font-size: 14px; min-width: 0; }
  .sw input[type=checkbox] { flex: none; width: 22px; height: 22px; accent-color: var(--acc); }

  pre {
    background: #0f141c; border: 1px solid var(--line); border-radius: 12px; padding: 11px;
    font: 11px/1.55 ui-monospace, Menlo, Consolas, monospace; color: #9fb0c8;
    overflow-x: auto; max-height: 280px; white-space: pre-wrap; word-break: break-all;
    margin-top: var(--gap);
  }
  .midi { font-size: 12px; color: var(--mut); }

  /* ---------- 触发检查 ---------- */
  .ck {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    flex-wrap: wrap; padding: 9px 2px; border-top: 1px solid var(--line); font-size: 13px;
  }
  .ck:first-child { border-top: none; }
  .ck > :first-child { min-width: 0; }
  .ck .ok { color: var(--ok); font-weight: 600; }
  .ck .bad { color: var(--warn); font-weight: 600; }

  /* ---------- 任务卡 ---------- */
  .prof { background: var(--card2); border: 1px solid var(--line); border-radius: 13px; padding: 11px 12px; margin-top: 10px; }
  .prof:first-child { margin-top: 0; }
  /* 任务名独占一行: nowrap 保证任何语言都只占一行, 永远不会被挤成竖排。
     放不下就省略号, 完整名字仍在 title 里, 长按可见。 */
  .prof .pn {
    display: block; font-weight: 700; font-size: 14px; line-height: 1.4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .prof .pbadges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
  .prof .pm { font-size: 11px; color: var(--mut); margin-top: 7px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .prof .prow2 {
    display: flex; align-items: center; gap: 7px; margin-top: 9px;
    padding-top: 9px; border-top: 1px solid var(--line); flex-wrap: wrap;
  }
  .prof .prow2 input[type=time] { flex: none; width: 116px; padding: 7px 8px; font-size: 13px; }
  .prof .prow2 label { font-size: 12px; color: var(--mut); display: flex; align-items: center; gap: 5px; }
  .prof .prow2 input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--acc); }
  .pkgbox {
    flex: 1; min-width: 130px; background: #0f141c; color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
    font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .pkgbox:disabled { opacity: .45; }
  .prof .pbtns { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
  .prof select.cleanup { flex: none; width: auto; padding: 7px 8px; font-size: 12px; border-radius: 8px; }
  .pill {
    font-size: 11px; padding: 3px 9px; border-radius: 999px;
    background: #0f141c; border: 1px solid var(--line); color: var(--mut); white-space: nowrap;
  }
  .pill.ok { color: var(--ok); border-color: #1e5c38; }
  .pill.warn { color: var(--warn); border-color: #6b4a12; }
  .rec-on { color: #f87171; font-weight: 700; }

  /* ---------- 每周执行日 ---------- */
  .daysrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: var(--gap); }
  .daysrow .dl { font-size: 11px; color: var(--mut); flex: none; }
  .daybtns { display: flex; gap: 5px; flex-wrap: wrap; }
  .daybtns button {
    padding: 6px 0; width: 34px; font-size: 12px; text-align: center;
    border-radius: 8px; color: var(--mut);
  }
  .daybtns button.on { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 700; }
  /* 跟随全局时用虚线边框区分: 「亮着」不等于「本任务自己定的」 */
  .daybtns button.inherit { border-style: dashed; }

  /* ---------- 图案九宫格 ---------- */
  .patpad {
    position: relative; width: 246px; height: 246px; margin: 10px auto 4px;
    display: grid; grid-template-columns: repeat(3, 1fr); place-items: center;
    touch-action: none; user-select: none; -webkit-user-select: none;
    background: #0f141c; border: 1px solid var(--line); border-radius: 16px;
  }
  .patpad .patdot {
    width: 46px; height: 46px; border-radius: 50%; padding: 0;
    background: var(--card2); border: 2px solid var(--line); color: var(--mut);
    font-size: 13px; font-weight: 700; line-height: 1; cursor: pointer;
  }
  .patpad .patdot.on { background: var(--acc); border-color: var(--acc); color: #fff; }
  .patsvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #patLine { fill: none; stroke: var(--acc); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: .75; }
  .patseq { font-variant-numeric: tabular-nums; }

  footer { max-width: 560px; margin: 18px auto 0; text-align: center; font-size: 11px; color: var(--mut); }
</style>
</head>
<body>

<!-- 缺桥提示: 默认隐藏, 由 app.js 在检测不到 root 管理器注入的 ksu 接口时显示。
     放在最前面, 保证「打不开」时用户第一眼看到的是原因和办法, 而不是满屏 ERR。 -->
<div id="nobridge" hidden>
  <h2 data-i18n="app.nobridge">未检测到 root 管理器接口</h2>
  <p data-i18n="app.nobridge.hint"></p>
  <p data-i18n="app.nobridge.fix"></p>
</div>

<header>
  <h1 data-i18n="app.title">💧 澎湃自动化 · Xiaomi 17 Pro</h1>
  <span id="ver">v0.12.0</span>
  <select id="lang" data-i18n-title="lbl.lang" title="语言"></select>
</header>

<!-- 概览: 状态一眼可见, 常用操作集中在这里; 细节全部收进下面的折叠分组 -->
<div class="hero">
  <div class="chips">
    <span id="today" class="chip" data-i18n="app.loading">…</span>
    <span id="svcpill" class="chip">…</span>
  </div>
  <p class="hint" data-i18n="hero.hint"></p>
  <div class="hero-btns">
    <!-- 这里原本还有一个「💧 立即浇水（测试）」(#btnTrigger), 它调 `trigger` 无参数,
         而无参数的默认就是内置工行 —— 与下面工行 profile 行的「立即浇水」
         (`trigger icbc`) 是同一个操作, 文案也几乎一样。按用户要求一起去重:
         运行类操作统一由每个 profile 行自己发, 顶部不再放一个写死工行的快捷键
         (有了多个任务之后, 顶部这个按钮只跑工行反而会误导)。 -->
    <button id="btnRefresh" class="ghost" data-i18n="btn.refresh">刷新</button>
    <button id="btnRestart" class="ghost" data-i18n="btn.restart">重启服务</button>
    <button id="btnFold" class="ghost" data-i18n="ui.collapse">收起全部</button>
  </div>
</div>

<main>
  <!-- 任务 Profiles 是「什么时候浇水」的唯一出处。
       原来这里上面还有一张「⏰ 每日浇水时间」卡, 写的是 sched.conf 的全局 SCHED_TIME,
       而调度器取的是 profile 自己的 P_SCHED(service.sh: PSCHED=${P_SCHED:-$SCHED_TIME})。
       内置工行 profile 在创建时就把 SCHED_TIME 快照进了 P_SCHED(customize.sh / service.sh
       ensure_profiles), 于是那张卡改完对工行根本不生效 —— 是个死控件, 而且让人以为
       「有两套定时」。删除它, 每个 profile 行自己的时间+开关就是唯一真相。 -->
  <details class="sec" open>
    <summary data-i18n="card.prof.title">📁 任务 Profiles</summary>
    <div class="sbody">
      <p class="hint" data-i18n="card.prof.hint"></p>
      <!-- 原 card.time.hint 的内容, 随卡片一起去重搬过来: 说清「到点之后会发生什么」
           以及为什么默认 07:30, 这两条信息本身是对的, 不该跟着卡片一起被删掉。 -->
      <p class="hint" data-i18n="prof.schedHint"></p>
      <!-- 全局执行日: 只作用于「跟随全局」的任务; 单个任务在它自己的卡片里覆盖 -->
      <div class="daysrow">
        <span class="dl" data-i18n="lbl.days">每周执行日</span>
        <div class="daybtns" id="daysGlobalBtns"></div>
      </div>
      <p class="fldcap" data-i18n="days.hint"></p>
      <div id="profs"></div>
      <!-- 内置工行任务删掉后才出现: 有它在, 这个按钮点了也是「已存在」 -->
      <div class="row" id="icbcRow" hidden>
        <button id="btnAddIcbc" class="ghost flex1" data-i18n="btn.addIcbc">恢复内置工行任务</button>
      </div>
      <p class="fldcap" data-i18n="scale.hint"></p>
      <p class="fldcap" data-i18n="prof.new"></p>
      <div class="grid2">
        <input type="text" id="npName" data-i18n-ph="ph.npName" placeholder="新任务名" class="flex1">
        <input type="text" id="npPkg" data-i18n-ph="ph.npPkg" placeholder="包名" class="flex1">
      </div>
      <label class="fld" style="margin-top:var(--gap)"><span data-i18n="lbl.recMode">录制方式</span>
        <select id="npScope">
          <option value="pkg" data-i18n="opt.rec.pkg">指定包名录取</option>
          <option value="all" data-i18n="opt.rec.all">全场录取（不填包名）</option>
        </select>
      </label>
      <p class="fldcap" data-i18n="prof.recModeHint"></p>
      <div class="row">
        <input type="time" id="npTime" value="07:30" style="flex:none;width:116px">
        <button id="btnPAdd" class="primary flex1" data-i18n="btn.add">＋ 新增</button>
      </div>
    </div>
  </details>

  <details class="sec">
    <summary data-i18n="card.pin.title">🔓 锁屏密码 (PIN)</summary>
    <div class="sbody">
      <p class="hint" data-i18n="card.pin.hint"></p>
      <div class="row">
        <input type="password" id="pin" data-i18n-ph="ph.pinSet" placeholder="已设置" inputmode="numeric" maxlength="8" autocomplete="off" class="flex1">
        <button id="btnShow" class="ghost" data-i18n="btn.show">显示</button>
        <button id="btnPin" class="primary" data-i18n="btn.save">保存</button>
      </div>
      <label class="sw"><span data-i18n="lbl.unlockMode">解锁方式</span>
        <select id="mode" style="flex:none;width:auto">
          <option value="pin" data-i18n="opt.pin">PIN 盲打解锁</option>
          <option value="pattern" data-i18n="opt.pattern">图案解锁（九宫格）</option>
          <option value="swipe" data-i18n="opt.swipe">上滑解锁（无密码）</option>
        </select>
      </label>
      <!-- 图案在这里提前画好, 到点由服务端按点序一笔画完 —— 不需要读屏识别图案 -->
      <div id="patBox" hidden>
        <p class="fldcap" data-i18n="card.pat.hint"></p>
        <div class="patpad" id="patPad">
          <svg class="patsvg" id="patSvg" aria-hidden="true"><polyline id="patLine" points=""></polyline></svg>
          <button type="button" class="patdot" data-n="1">1</button>
          <button type="button" class="patdot" data-n="2">2</button>
          <button type="button" class="patdot" data-n="3">3</button>
          <button type="button" class="patdot" data-n="4">4</button>
          <button type="button" class="patdot" data-n="5">5</button>
          <button type="button" class="patdot" data-n="6">6</button>
          <button type="button" class="patdot" data-n="7">7</button>
          <button type="button" class="patdot" data-n="8">8</button>
          <button type="button" class="patdot" data-n="9">9</button>
        </div>
        <div class="row">
          <span class="pill patseq flex1" id="patStat" data-i18n="pat.unset">未画</span>
          <button id="btnPatClear" class="ghost" data-i18n="btn.patClear">清除</button>
          <button id="btnPatSave" class="primary" data-i18n="btn.patSave">保存图案</button>
        </div>
      </div>
      <div class="row">
        <button id="btnUnlockTest" class="ghost flex1" data-i18n="btn.unlockTest">🔒 测试解锁（锁屏→解锁）</button>
      </div>
      <p class="fldcap" data-i18n="unlock.test.hint"></p>
    </div>
  </details>

  <details class="sec">
    <summary data-i18n="dev.title">📱 设备档案</summary>
    <div class="sbody">
      <div class="row">
        <span class="pill" id="devBadge">—</span>
        <label class="flex1" style="font-size:12px;color:var(--mut);display:flex;align-items:center;gap:7px;justify-content:flex-end">
          <span data-i18n="dev.apply">启用覆盖</span><input type="checkbox" id="devApply">
        </label>
      </div>
      <!-- 徽标说明必须可见: Android WebView 触屏不会弹 title, 只靠悬停提示等于没提示 -->
      <p class="fldcap" data-i18n="dev.status.hint"></p>
      <p class="hint" data-i18n="dev.hint.short" style="margin-top:10px"></p>
      <div class="row">
        <label class="fld flex1"><span data-i18n="dev.model">机型</span><input type="text" id="devModel" data-i18n-ph="dev.model"></label>
        <label class="fld flex1"><span data-i18n="dev.label">显示名</span><input type="text" id="devLabel" data-i18n-ph="dev.label"></label>
      </div>
      <div class="row">
        <button class="ghost flex1" id="btnDevDetect" data-i18n="dev.detect">🔍 自动检测本机</button>
        <button class="primary flex1" id="btnDevSave" data-i18n="btn.save">保存</button>
      </div>
      <p class="fldcap" data-i18n="dev.apply.hint"></p>
      <div class="grid4">
        <label class="fld"><span data-i18n="dev.sw">屏宽</span><input type="number" id="devSW" min="300" step="1"></label>
        <label class="fld"><span data-i18n="dev.sh">屏高</span><input type="number" id="devSH" min="300" step="1"></label>
        <label class="fld"><span data-i18n="dev.d">显示 ID</span><input type="number" id="devD" min="0" step="1"></label>
        <label class="fld"><span data-i18n="dev.dpi">DPI</span><input type="number" id="devDPI" min="0" step="1"></label>
      </div>
      <p class="fldcap" data-i18n="dev.pin">锁屏密码宫格</p>
      <div class="grid4">
        <input type="number" id="devPX0" min="1" step="1" aria-label="X0">
        <input type="number" id="devPY0" min="1" step="1" aria-label="Y0">
        <input type="number" id="devPDX" min="1" step="1" aria-label="DX">
        <input type="number" id="devPDY" min="1" step="1" aria-label="DY">
      </div>
      <p class="fldcap" data-i18n="dev.pat">锁屏图案宫格</p>
      <div class="grid4">
        <input type="number" id="devPaX0" min="1" step="1" aria-label="PX0">
        <input type="number" id="devPaY0" min="1" step="1" aria-label="PY0">
        <input type="number" id="devPaDX" min="1" step="1" aria-label="PDX">
        <input type="number" id="devPaDY" min="1" step="1" aria-label="PDY">
      </div>
    </div>
  </details>

  <details class="sec">
    <summary data-i18n="card.misc.title">⚙️ 其它</summary>
    <div class="sbody">
      <label class="sw"><span data-i18n="lbl.watchOpen">每日首次打开工行自动浇水</span><input type="checkbox" id="watch"></label>
      <label class="sw"><span data-i18n="lbl.sleepAfter">浇完自动熄屏</span><input type="checkbox" id="sleep"></label>
      <label class="sw"><span data-i18n="lbl.cleanupAfter">跑完清理后台（释放内存）</span><input type="checkbox" id="cleanup"></label>
      <p class="hint" data-i18n="lbl.cleanupHint" style="margin-top:6px"></p>
    </div>
  </details>

  <details class="sec">
    <summary data-i18n="card.chk.title">🔬 触发检查（没浇时看这里）</summary>
    <div class="sbody">
      <p class="hint" data-i18n="card.chk.hint"></p>
      <div id="chk"></div>
    </div>
  </details>

  <details class="sec">
    <summary data-i18n="card.log.title">📜 运行日志</summary>
    <div class="sbody">
      <div class="row">
        <p class="hint flex1" data-i18n="card.log.hint"></p>
        <button id="btnLog" class="small ghost" data-i18n="btn.logRefresh">刷新</button>
      </div>
      <pre id="log" data-i18n="log.empty">(no log yet)</pre>
    </div>
  </details>
</main>

<footer>
  <div id="footver"></div>
</footer>

<script type="module" src="./app.js"></script>
</body>
</html>
