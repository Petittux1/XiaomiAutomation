# icbc_daily_water 配置 (WebUI/文件修改, 存 /data/adb/icbc_water/sched.conf, 已 chmod 600)
# 改完 2 秒内热加载生效(无需重启); 此文件为默认模板, 首次安装后请用 WebUI 填 PIN
SCHED_ENABLE=1
SCHED_TIME=0730
UNLOCK_MODE=pin
OPEN_MODE=monkey
SLEEP_AFTER=1
WATCH_OPEN=0
# 跑完任务后自动 force-stop 目标 app, 让它退出后台并释放内存 (下次从干净状态起)。
# 同 app 接力的任务可在该 profile 的 conf 里写 P_CLEANUP=0 单独关闭。
CLEANUP_AFTER=1
PIN=
PIN_X0=290
PIN_Y0=1015
PIN_DX=320
PIN_DY=210