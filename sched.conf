# icbc_daily_water 配置 (WebUI/文件修改, 存 /data/adb/icbc_water/sched.conf, 已 chmod 600)
# 改完 2 秒内热加载生效(无需重启); 此文件为默认模板, 首次安装后请用 WebUI 填 PIN
SCHED_ENABLE=1
SCHED_TIME=0730
# 每周执行日 (SCHED_DAYS): 一串从周一到周日的升序数字, 例如「135」表示周一三五,
# 「1234567」表示每天(默认), 「0」表示一周都不跑。留空等同每天。
# 单个任务可以在它自己的 conf 里写 P_DAYS 覆盖这里; 没写的就跟随本值。
# 注意: 本文件的注释里不要写带等号的示例 —— WebUI 解析状态时按「键等号值」逐 token
# 抓取, 注释里的示例会被误当成真实配置。
SCHED_DAYS=1234567
UNLOCK_MODE=pin
# 图案解锁的点序 (PATTERN): 1-9 的数字串, 宫格从左上到右下编号, 至少 4 个点且不重复。
# 留空 = 不用图案; UNLOCK_MODE 设为 pattern 时才生效, 空则自动回落到 PIN。
PATTERN=
OPEN_MODE=monkey
SLEEP_AFTER=1
WATCH_OPEN=0
# 跑完任务后自动 force-stop 目标 app, 让它退出后台并释放内存 (下次从干净状态起)。
# 同 app 接力的任务, 可在对应 profile 的 conf 里把 P_CLEANUP 置 0 单独关闭。
# 注意: 本文件的注释里不要写 "键=值" 形式的示例 —— WebUI 解析状态时按
# "键=值" 逐 token 抓取, 注释里的示例会被误当成真实配置。
CLEANUP_AFTER=1
PIN=
PIN_X0=290
PIN_Y0=1015
PIN_DX=320
PIN_DY=210
# 图案宫格几何 (PAT_ 起点加间距, 单位像素): PAT_X0/PAT_Y0 是第 1 格中心,
# PAT_DX/PAT_DY 是相邻两格中心距。默认值按 17 Pro 居中估算, 换机器请用 WebUI
# 里「锁屏图案」的测试按钮逐格校准 (画错一格系统就当错图案, 不会解锁)。
PAT_X0=270
PAT_Y0=1000
PAT_DX=340
PAT_DY=340