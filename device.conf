# icbc_daily_water 设备档案 v0.11.0 (安装时复制到 /data/adb/icbc_water/device.conf)
#
# ===== 先读这一段 =====
# DEV_APPLY 是总闸:
#   0 = 不覆盖。完全使用 water.sh 里的实测默认值(sched.conf 里的 PIN 键盘坐标同理)。
#       ***Xiaomi 17 Pro 用的就是这个值。***
#       那套数值已经在真机上跑通并验证, 是本模块的基线, 请勿修改。
#       为 0 时, service.sh / water.sh / record.sh / replay.sh 里读取本档案的
#       那几行代码一次都不会执行, 各脚本拿到的 SW/SH/D/PIN 与 v0.10.0 逐字节一致。
#   1 = 用下面的 DEV_* 覆盖屏幕尺寸、显示 ID 和 PIN 键盘位置。
#       换机器时在 WebUI 的「设备」卡片里选机型或点「自动检测」, 由模块写这个值。
#
# 覆盖的安全边界: 每个值都先做「纯数字」校验, 缺失或含非数字字符就保留原值。
# 所以这个文件即使损坏, 后果最多是覆盖不生效, 不会把浇水流程带歪。
#
# ===== 字段说明 =====
# DEV_APPLY    总闸, 0/1
# DEV_MODEL    机型标识, 纯 ASCII, 供界面显示与记录用
# DEV_LABEL    机型显示名, 空格写成 _, 避免任何解析歧义
# DEV_STATUS   stable = 已实测验证; testing = 测试中, 不保证可用
# DEV_SW       屏幕宽(像素)
# DEV_SH       屏幕高(像素)
# DEV_D        显示 ID, `dumpsys display` 查; 多数手机为 0
# DEV_DPI      界面密度, `wm density` 查; 仅用于界面显示与提醒, 不参与坐标计算
# DEV_PIN_X0   锁屏 4 列宫格第一列的 X 中心(像素)
# DEV_PIN_Y0   锁屏 4 行宫格第一行的 Y 中心(像素)
# DEV_PIN_DX   列间距(像素)
# DEV_PIN_DY   行间距(像素)
# DEV_PAT_X0   锁屏图案九宫格第 1 格中心的 X(像素); 未启用图案解锁时可忽略
# DEV_PAT_Y0   锁屏图案九宫格第 1 格中心的 Y(像素)
# DEV_PAT_DX   图案相邻两格的横向中心距(像素)
# DEV_PAT_DY   图案相邻两格的纵向中心距(像素)
# 图案几何的 17 Pro 基线同样来自 1220x2656 锁屏截图实测; 换机器请用 WebUI
# 「锁屏密码」卡片里的测试按钮校准 —— 图案错一格系统就当错误图案, 不解锁。

# ---------- Xiaomi 17 Pro: 已实测验证的基线, DEV_APPLY 保持 0 ----------
DEV_APPLY=0
DEV_MODEL=17pro
DEV_LABEL=Xiaomi_17_Pro
DEV_STATUS=stable
DEV_SW=1220
DEV_SH=2656
DEV_D=4630946949513469331
DEV_DPI=560
DEV_PIN_X0=290
DEV_PIN_Y0=1015
DEV_PIN_DX=320
DEV_PIN_DY=210
DEV_PAT_X0=310
DEV_PAT_Y0=1193
DEV_PAT_DX=300
DEV_PAT_DY=300
